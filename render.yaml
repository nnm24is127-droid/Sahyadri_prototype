services:
  - type: web
    name: farmconnect-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: PROJECT_NAME
        value: FarmConnect AI
      - key: DATABASE_URL
        fromDatabase:
          name: farmconnect-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        value: '["https://farmconnect-ai.vercel.app","http://localhost:5173"]'
      - key: ANTHROPIC_MODEL
        value: claude-3-5-sonnet-20241022
      - key: BLOCKCHAIN_RPC_URL
        value: http://127.0.0.1:8545
      - key: CHAIN_ID
        value: 31337

databases:
  - name: farmconnect-db
    region: singapore
    plan: free
    databaseName: farmconnect
    user: farmconnect_user
